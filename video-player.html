<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSIA Platform Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            background: #16213e;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #FFE600;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            color: #FFE600;
        }

        .container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-primary {
            background: #FFE600;
            color: #1a1a2e;
        }

        .btn-secondary {
            background: #2a2a4a;
            color: #fff;
            border: 1px solid #444;
        }

        .btn-fullscreen {
            background: #0f3460;
            color: #fff;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .note {
            color: #888;
            font-size: 0.85rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .header { padding: 14px 20px; }
            .header h1 { font-size: 1.1rem; }
            .container { padding: 20px 12px; }
            .btn { padding: 12px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><span>KSIA</span> &mdash; Platform Demo Video</h1>
    </div>

    <div class="container">
        <div class="video-wrapper" id="videoWrapper">
            <iframe
                src="https://drive.google.com/file/d/1axqEOwBywlDbnP_Hxgm-MiCeF6Epk5sY/preview"
                allow="autoplay; fullscreen"
                allowfullscreen
            ></iframe>
        </div>

        <div class="actions">
            <button class="btn btn-fullscreen" onclick="goFullscreen()">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                Fullscreen
            </button>

            <a class="btn btn-primary" href="https://drive.google.com/uc?export=download&id=1axqEOwBywlDbnP_Hxgm-MiCeF6Epk5sY" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Download Video
            </a>

            <a class="btn btn-secondary" href="https://drive.google.com/file/d/1axqEOwBywlDbnP_Hxgm-MiCeF6Epk5sY/view" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                Open in Google Drive
            </a>
        </div>

        <p class="note">
            Click <strong>Fullscreen</strong> to watch in your browser, or <strong>Download</strong> to save and play in VLC or your preferred media player.
        </p>
    </div>

    <script>
        function goFullscreen() {
            const wrapper = document.getElementById('videoWrapper');
            const iframe = wrapper.querySelector('iframe');
            if (iframe.requestFullscreen) iframe.requestFullscreen();
            else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
            else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
        }
    </script>
</body>
</html>
